<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="3"/>

  <!-- Cyber Node Corner Accents -->
  <circle cx="28" cy="28" r="3" fill="#00F2FE" opacity="0.8"/>
  <circle cx="100" cy="28" r="3" fill="#38BDF8" opacity="0.8"/>
  <circle cx="28" cy="100" r="3" fill="#38BDF8" opacity="0.8"/>
  <circle cx="100" cy="100" r="3" fill="#00F2FE" opacity="0.8"/>

  <!-- Horizontal Tech Connect Lines -->
  <line x1="38" y1="28" x2="90" y2="28" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="38" y1="100" x2="90" y2="100" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Monogram Brand ZYX -->
  <text x="64" y="66" font-family="'JetBrains Mono', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#neonGrad)" text-anchor="middle" letter-spacing="1" filter="url(#neonGlow)">ZYX</text>

  <!-- Subtitle TEO -->
  <text x="64" y="86" font-family="'JetBrains Mono', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="3.5">TEO</text>
</svg>
